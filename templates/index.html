<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadLens — AI Traffic Sign Recognition</title>
    <meta name="description" content="Upload or use your webcam to instantly recognize traffic signs with AI.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0f1e;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
            --accent-cyan: #22d3ee;
            --accent-green: #10b981;
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(34, 211, 238, 0.08), transparent);
        }

        /* ─── Header ─── */
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
        }
        .header p { color: var(--text-muted); margin-top: 0.4rem; font-size: 0.95rem; }

        /* ─── Mode Tabs ─── */
        .mode-tabs {
            display: flex;
            gap: 0.25rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 0.75rem;
            padding: 0.25rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-glass);
        }
        .mode-tab {
            flex: 1;
            padding: 0.65rem 1rem;
            border: none;
            border-radius: 0.6rem;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .mode-tab:hover { color: var(--text-primary); }
        .mode-tab.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(34, 211, 238, 0.15));
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }
        .mode-tab svg { width: 18px; height: 18px; }

        /* ─── Card ─── */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 1.25rem;
            padding: 2rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* ─── Upload Mode ─── */
        .drag-area {
            border: 2px dashed rgba(59, 130, 246, 0.4);
            border-radius: 1rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        .drag-area:hover, .drag-area.dragover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.06);
        }
        .drag-area svg { margin: 0 auto 0.75rem; color: var(--accent-blue); }
        .drag-area .label { font-weight: 600; color: rgba(147, 197, 253, 0.9); font-size: 0.95rem; }
        .drag-area .sublabel { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem; }
        .image-preview {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 0.75rem;
            display: none;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* ─── Camera Mode ─── */
        .camera-container { display: none; }
        .camera-container.active { display: block; }
        .upload-container.active { display: block; }
        .upload-container { display: none; }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            margin-bottom: 1rem;
            background: #000;
            aspect-ratio: 4/3;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .video-wrapper canvas { display: none; }
        .video-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
        }
        .scanning-line {
            position: absolute;
            left: 10%; right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            box-shadow: 0 0 15px var(--accent-cyan);
            animation: scan 2.5s ease-in-out infinite;
            opacity: 0;
        }
        .scanning-line.active { opacity: 1; }
        @keyframes scan {
            0%, 100% { top: 15%; }
            50% { top: 85%; }
        }

        .camera-controls {
            display: flex;
            gap: 0.5rem;
        }

        /* ─── Live Result Badge ─── */
        .live-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.7rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .live-badge.active { opacity: 1; }
        .live-dot {
            width: 6px; height: 6px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .camera-prediction {
            position: absolute;
            bottom: 0.75rem;
            left: 0.75rem;
            right: 0.75rem;
            padding: 0.6rem 0.9rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 0.65rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.3s ease;
        }
        .camera-prediction.active {
            opacity: 1;
            transform: translateY(0);
        }
        .camera-prediction .pred-label { font-weight: 700; font-size: 0.9rem; }
        .camera-prediction .pred-conf {
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 600;
        }

        /* ─── Buttons ─── */
        .btn {
            width: 100%;
            padding: 0.8rem 1.25rem;
            border: none;
            border-radius: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-green:hover { box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .btn-red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .btn-red:hover { box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4); }

        /* ─── Upload Result ─── */
        .result-box {
            margin-top: 1.5rem;
            text-align: center;
            padding: 1.25rem;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 0.75rem;
            display: none;
        }
        .result-box.active { display: block; animation: fadeUp 0.4s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .result-box .result-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }
        .result-box .result-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        /* ─── Loader ─── */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Footer ─── */
        .footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RoadLens</h1>
        <p>Upload or use your camera to recognize traffic signs instantly.</p>
    </div>

    <div class="card">
        <!-- Mode Toggle -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-upload" onclick="switchMode('upload')">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Upload Image
            </button>
            <button class="mode-tab" id="tab-camera" onclick="switchMode('camera')">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                Open Camera
            </button>
        </div>

        <!-- ═══ Upload Mode ═══ -->
        <div class="upload-container active" id="upload-section">
            <form id="upload-form" enctype="multipart/form-data">
                <div class="drag-area" id="drag-box" onclick="document.getElementById('file-upload').click()">
                    <input type="file" id="file-upload" name="file" class="hidden" accept="image/*" onchange="previewImage(event)" style="display:none">
                    <div id="upload-placeholder">
                        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.338-2.32 3 3 0 013.448 3.1A3.75 3.75 0 0118 19.5H6.75z"/>
                        </svg>
                        <p class="label">Click or drag an image here</p>
                        <p class="sublabel">PNG, JPG, JPEG — up to 10 MB</p>
                    </div>
                </div>
                <img id="img-preview" class="image-preview" alt="Preview of uploaded traffic sign"/>
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    <span>Analyze Sign</span>
                    <div class="spinner" id="upload-spinner"></div>
                </button>
            </form>
            <div class="result-box" id="upload-result">
                <p class="result-label">Prediction</p>
                <p class="result-value" id="upload-result-text"></p>
            </div>
        </div>

        <!-- ═══ Camera Mode ═══ -->
        <div class="camera-container" id="camera-section">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="snap-canvas"></canvas>
                <div class="video-overlay">
                    <div class="scanning-line" id="scan-line"></div>
                    <div class="live-badge" id="live-badge">
                        <span class="live-dot"></span> LIVE
                    </div>
                    <div class="camera-prediction" id="cam-prediction">
                        <span class="pred-label" id="cam-pred-label">—</span>
                        <span class="pred-conf" id="cam-pred-conf"></span>
                    </div>
                </div>
            </div>
            <div class="camera-controls">
                <button class="btn btn-green" id="btn-start-cam" onclick="startCamera()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    Start Camera
                </button>
                <button class="btn btn-red" id="btn-stop-cam" onclick="stopCamera()" style="display:none">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
                    Stop Camera
                </button>
            </div>
        </div>
    </div>

    <p class="footer">Powered by TensorFlow &middot; Built with Flask</p>

    <script>
        /* ── Element References ── */
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-upload');
        const imgPreview = document.getElementById('img-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const submitBtn = document.getElementById('submit-btn');
        const submitText = submitBtn.querySelector('span');
        const uploadSpinner = document.getElementById('upload-spinner');
        const uploadResult = document.getElementById('upload-result');
        const uploadResultText = document.getElementById('upload-result-text');
        const dragBox = document.getElementById('drag-box');

        const video = document.getElementById('webcam');
        const snapCanvas = document.getElementById('snap-canvas');
        const scanLine = document.getElementById('scan-line');
        const liveBadge = document.getElementById('live-badge');
        const camPrediction = document.getElementById('cam-prediction');
        const camPredLabel = document.getElementById('cam-pred-label');
        const camPredConf = document.getElementById('cam-pred-conf');
        const btnStartCam = document.getElementById('btn-start-cam');
        const btnStopCam = document.getElementById('btn-stop-cam');

        let cameraStream = null;
        let predictionInterval = null;

        /* ── Mode Switching ── */
        function switchMode(mode) {
            const uploadSection = document.getElementById('upload-section');
            const cameraSection = document.getElementById('camera-section');
            const tabUpload = document.getElementById('tab-upload');
            const tabCamera = document.getElementById('tab-camera');

            if (mode === 'upload') {
                uploadSection.classList.add('active');
                cameraSection.classList.remove('active');
                tabUpload.classList.add('active');
                tabCamera.classList.remove('active');
                stopCamera();
            } else {
                uploadSection.classList.remove('active');
                cameraSection.classList.add('active');
                tabUpload.classList.remove('active');
                tabCamera.classList.add('active');
            }
        }

        /* ── Upload: Image Preview ── */
        function previewImage(event) {
            handleFile(event.target.files[0]);
        }

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                placeholder.style.display = 'none';
                dragBox.style.display = 'none';
                uploadResult.classList.remove('active');
            };
            reader.readAsDataURL(file);
        }

        /* ── Upload: Drag & Drop ── */
        dragBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragBox.classList.add('dragover');
        });
        dragBox.addEventListener('dragleave', () => dragBox.classList.remove('dragover'));
        dragBox.addEventListener('drop', (e) => {
            e.preventDefault();
            dragBox.classList.remove('dragover');
            if (e.dataTransfer.files?.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        /* ── Upload: Submit ── */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!fileInput.files.length) {
                alert('Please select an image first!');
                return;
            }

            submitText.textContent = 'Analyzing...';
            uploadSpinner.style.display = 'block';
            submitBtn.disabled = true;
            uploadResult.classList.remove('active');

            try {
                const resp = await fetch('/predict', {
                    method: 'POST',
                    body: new FormData(form)
                });
                if (resp.ok) {
                    uploadResultText.textContent = await resp.text();
                    uploadResult.classList.add('active');
                } else {
                    uploadResultText.textContent = 'Error processing image.';
                    uploadResult.classList.add('active');
                }
            } catch (err) {
                console.error(err);
                alert('Network error. Is the server running?');
            } finally {
                submitText.textContent = 'Analyze Sign';
                uploadSpinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        /* ── Camera: Start ── */
        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = cameraStream;

                btnStartCam.style.display = 'none';
                btnStopCam.style.display = 'flex';
                scanLine.classList.add('active');
                liveBadge.classList.add('active');

                // Start sending frames every 1.5 seconds
                predictionInterval = setInterval(captureAndPredict, 1500);
            } catch (err) {
                console.error(err);
                alert('Could not access camera. Please allow camera permissions.');
            }
        }

        /* ── Camera: Stop ── */
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            if (predictionInterval) {
                clearInterval(predictionInterval);
                predictionInterval = null;
            }
            video.srcObject = null;
            btnStartCam.style.display = 'flex';
            btnStopCam.style.display = 'none';
            scanLine.classList.remove('active');
            liveBadge.classList.remove('active');
            camPrediction.classList.remove('active');
        }

        /* ── Camera: Capture Frame & Send ── */
        async function captureAndPredict() {
            if (!cameraStream) return;

            snapCanvas.width = video.videoWidth;
            snapCanvas.height = video.videoHeight;
            const ctx = snapCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const dataUrl = snapCanvas.toDataURL('image/jpeg', 0.8);

            try {
                const resp = await fetch('/predict_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });

                if (resp.ok) {
                    const data = await resp.json();
                    camPredLabel.textContent = data.prediction;
                    camPredConf.textContent = data.confidence + '%';
                    camPrediction.classList.add('active');
                }
            } catch (err) {
                console.error('Prediction error:', err);
            }
        }
    </script>
</body>
</html>
